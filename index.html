<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vicore — Marketing de Conteúdo e Posicionamento</title>
    <meta
      name="description"
      content="A Vicore desenvolve a estratégia e o conteúdo que posicionam sua marca. Em 90 dias, seu perfil vende por você — vídeo, posicionamento e produção de conteúdo para negócios que querem crescer de verdade."
    />
    <meta property="og:title" content="Vicore — Marketing de Conteúdo e Posicionamento" />
    <meta
      property="og:description"
      content="Desenvolvemos a estratégia e o conteúdo que posicionam sua marca. Em 90 dias, seu perfil vende por você."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Carregada sem bloquear a renderização: em conexões lentas/instáveis
         (comum em mobile), uma folha de estilo externa no <head> travava a
         página inteira até a fonte carregar ou falhar. media="print" faz o
         navegador buscar sem aplicar; o onload troca pra "all" assim que
         chega, sem nunca segurar o primeiro paint. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,500&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,500&display=swap"
      />
    </noscript>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
