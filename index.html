    <!-- Carregada sem bloquear a renderização: em conexões lentas/instáveis
         (comum em mobile), uma folha de estilo externa no <head> travava a
         página inteira até a fonte carregar ou falhar. media="print" faz o
         navegador buscar sem aplicar; o onload troca pra "all" assim que
         chega, sem nunca segurar o primeiro paint. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      />
    </noscript>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-48.png" type="image/png" sizes="48x48" />
    <link rel="icon" href="/icon-512.png" type="image/png" sizes="512x512" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <!-- Sem JavaScript: some com as aberturas (Preloader/MobileIntro) e
         mostra o conteúdo que normalmente entra animado. -->
    <noscript>
      <style>
        [data-intro-overlay], .cursor-dot, .cursor-ring { display: none !important; }
        html { overflow: auto !important; }
        .reveal-card, .fade-up, .reveal-line, [data-reveal], .manifesto-line {
          opacity: 1 !important;
          transform: none !important;
          animation: none !important;
        }
      </style>
    </noscript>
